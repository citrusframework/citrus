# Quarkus live PoC: stdio only, loopback, no dev services.
quarkus.banner.enabled=false
quarkus.log.console.stderr=true
quarkus.log.level=WARN
quarkus.log.category."org.citrusframework.poc".level=INFO
quarkus.devservices.enabled=false
# Named-server spike (T12-live): @McpServer("poc-b") beans without a declared server
# are rejected (FAIL default). IGNORE lets boot proceed while dropping them, which
# the spike IT asserts as the declaration requirement. See results/quarkus.md.
quarkus.mcp.server.invalid-server-name-strategy=IGNORE
