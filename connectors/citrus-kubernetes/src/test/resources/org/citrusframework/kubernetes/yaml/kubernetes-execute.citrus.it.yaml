name: "KubernetesExecuteTest"
author: "Christoph"
status: "FINAL"
description: "Sample test in YAML"
actions:
  - kubernetes:
      client: "k8sClient"
      execute:
        info: {}

  - kubernetes:
      client: "k8sClient"
      execute:
        listPods:
          namespace: "test"
          label: "app=todo"
          validate:
            - path: "$..status.phase"
              value: "Running"

  - kubernetes:
      client: "k8sClient"
      execute:
        getPod:
          name: "my-pod"
          namespace: "test"

  - kubernetes:
      client: "k8sClient"
      execute:
        getService:
          name: "citrus-sample-todo-service"
          namespace: "test"
          validate:
            - path: "$.result.metadata.name"
              value: "citrus-sample-todo-service"
