name: "SeleniumTest"
author: "Christoph"
status: "FINAL"
actions:
  - selenium:
      browser: "seleniumBrowser"
      start: {}

  - selenium:
      alert:
        accept: true

  - selenium:
      alert:
        accept: false
        text: This is a warning message!

  - selenium:
      find:
        element:
          class-name: "clickable"
        validate:
          tag-name: "button"
          text: "Ok"
          displayed: true
          enabled: true
          attributes:
            - name: "type"
              value: "submit"
          styles:
            - name: "color"
              value: "#000000"

  - selenium:
      page:
        name: "userForm"
        action: "setUserName"
        argument: ${username}

  - selenium:
      page:
        type: "org.citrusframework.selenium.pages.UserFormPage"
        action: "validate"
        validator: "pageValidator"

  - selenium:
      click:
        element:
          id: "edit-link"

  - selenium:
      hover:
        element:
          id: "edit-link"

  - selenium:
      double-click:
        element:
          id: "double-click-me"

  - selenium:
      right-click:
        element:
          id: "right-click-me"

  - selenium:
      drag-and-drop:
        element:
          id: "source"
        target:
          id: "target"

  - selenium:
      press:
        keys: "ENTER"
        element:
          id: "username"

  - selenium:
      press:
        keys: "TAB"

  - selenium:
      set-input:
        value: "new-value"
        element:
          tag-name: "input"

  - selenium:
      check-input:
        checked: true
        element:
          xpath: "//input[@type: 'checkbox']"

  - selenium:
      dropdown-select:
        option: "male"
        element:
          name: "gender"

  - selenium:
      dropdown-select:
        element:
          id: "title"
        options:
          - "Mr."
          - "Dr."

  - selenium:
      dropdown-select:
        option: "Mr."
        by: "text"
        element:
          id: "title"

  - selenium:
      dropdown-select:
        option: "1"
        by: "index"
        element:
          id: "title"

  - selenium:
      dropdown-select:
        deselect-all: true
        element:
          id: "title"

  - selenium:
      dropdown-select:
        element:
          id: "title"
        deselect-options:
          - "Mr."
          - "Dr."

  - selenium:
      fill-form:
        fields:
          - id: "username"
            value: "foo_user"
          - id: "password"
            value: "secret"

  - selenium:
      fill-form:
        submit: "save"
        json: |
          { "username": "foo_user", "password": "secret" }

  - selenium:
      wait-until:
        condition: "hidden"
        element:
          id: "dialog"

  - selenium:
      wait-until:
        condition: "present"
        element:
          id: "dialog"

  - selenium:
      wait-until:
        condition: "clickable"
        timeout: 10000
        element:
          id: "submit-button"

  - selenium:
      wait-until:
        condition: "text"
        expected: "Ok"
        element:
          id: "dialog"

  - selenium:
      wait-until:
        condition: "url"
        expected: "selenium"

  - selenium:
      wait-until:
        condition: "title"
        expected: "Selenium"

  - selenium:
      javaScript:
        script: "alert('This is awesome!')"
        errors:
          - Something went wrong

  - selenium:
      browser: seleniumBrowser
      screenshot:
        output-dir: "/tmp/storage"

  - selenium:
      navigate:
        page: "back"

  - selenium:
      open-window:
        name: "newWindow"
  - selenium:
      switch-window:
        name: "switchWindow"
  - selenium:
      close-window:
        name: "closeWindow"

  - selenium:
      store-file:
        file-path: "classpath:download/file.txt"
  - selenium:
      get-stored-file:
        file-name: "file.txt"

  - selenium:
      clear-cache: {}

  - selenium:
      verify:
        check: "url"
        expected: "@endsWith('/selenium')@"

  - selenium:
      verify:
        check: "title"
        expected: "Selenium page"

  - selenium:
      verify:
        check: "present"
        element:
          id: "dialog"

  - selenium:
      verify:
        check: "absent"
        element:
          id: "missing"

  - selenium:
      verify:
        check: "displayed"
        element:
          id: "hello"

  - selenium:
      verify:
        check: "hidden"
        element:
          id: "dialog"

  - selenium:
      verify:
        check: "enabled"
        element:
          id: "hello"

  - selenium:
      verify:
        check: "text"
        expected: "@contains('Ok')@"
        element:
          id: "dialog"

  - selenium:
      verify:
        check: "attribute"
        attribute: "href"
        expected: "https://citrusframework.org"
        element:
          id: "hello"

  - selenium:
      verify:
        check: "count"
        expected: "2"
        element:
          class-name: "order"

  - selenium:
      verify:
        check: "css-value"
        css-property: "color"
        expected: "#000000"
        element:
          id: "hello"

  - selenium:
      extract:
        value: "title"
        variable: "pageTitle"

  - selenium:
      extract:
        value: "text"
        variable: "dialogText"
        element:
          id: "dialog"

  - selenium:
      extract:
        value: "count"
        variable: "orderCount"
        element:
          class-name: "order"

  - selenium:
      extract:
        value: "attribute"
        attribute: "href"
        variable: "docsHref"
        element:
          id: "hello"

  - selenium:
      click:
        element:
          partial-link-text: "Click"

  - selenium:
      stop:
        browser: "seleniumBrowser"
