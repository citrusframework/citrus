<html lang="en">
  <head>
    <title>Parity Test</title>
    <script type="text/javascript">
      function scheduleRedirect() {
        setTimeout(function () {
          window.location.href = 'http://localhost:19090/form';
        }, 250);
      }
    </script>
  </head>
  <body>
    <h1 id="greeting">Hello Citrus</h1>

    <table>
      <tr class="order"><td>1</td><td>Apple</td></tr>
      <tr class="order"><td>2</td><td>Orange</td></tr>
      <tr class="order"><td>3</td><td>Banana</td></tr>
    </table>

    <p>
      <button id="submit" type="button" disabled>Submit</button>
    </p>

    <p>
      <a id="docs" href="https://citrusframework.org">Documentation</a>
    </p>

    <p>
      <span id="hidden-element" style="display: none">Hidden content</span>
    </p>

    <p>
      <button id="redirect" type="button" onclick="scheduleRedirect()">Redirect</button>
    </p>
  </body>
</html>
