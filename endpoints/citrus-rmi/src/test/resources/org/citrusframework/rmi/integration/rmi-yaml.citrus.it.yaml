name: RmiYamlIT
author: Christoph Deppisch
status: FINAL
description: Test RMI client server communication in YAML.

endpoints:
  - rmi:
      server:
        name: rmiYamlServer
        host: localhost
        port: 2199
        binding: newsService
        remote-interfaces: org.citrusframework.rmi.remote.NewsService
        create-registry: true
        timeout: 10000
        auto-start: true
  - rmi:
      client:
        name: rmiYamlClient
        host: localhost
        port: 2199
        binding: newsService

actions:
  - echo:
      message: "Test 1: Call RMI service as client and receive result"

  - send:
      endpoint: rmiYamlClient
      fork: true
      message:
        body:
          data: |
            <service-invocation xmlns="http://www.citrusframework.org/schema/rmi/message">
              <remote>org.citrusframework.rmi.remote.NewsService</remote>
              <method>getNews</method>
            </service-invocation>

  - receive:
      endpoint: rmiYamlServer
      message:
        body:
          data: |
            <service-invocation xmlns="http://www.citrusframework.org/schema/rmi/message">
              <remote>org.citrusframework.rmi.remote.NewsService</remote>
              <method>getNews</method>
            </service-invocation>

  - send:
      endpoint: rmiYamlServer
      message:
        body:
          data: |
            <service-result xmlns="http://www.citrusframework.org/schema/rmi/message">
              <object type="java.lang.String" value="This is news from RMI!"/>
            </service-result>

  - receive:
      endpoint: rmiYamlClient
      message:
        body:
          data: |
            <service-result xmlns="http://www.citrusframework.org/schema/rmi/message">
              <object type="java.lang.String" value="This is news from RMI!"/>
            </service-result>
