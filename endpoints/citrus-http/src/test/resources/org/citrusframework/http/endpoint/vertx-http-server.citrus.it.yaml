name: "VertxHttpServerYamlEndpointIT"
author: "Citrus"
status: "FINAL"
endpoints:
  - http:
      vertxServer:
        name: "yamlVertxHttpServer"
        port: 19302
        autoStart: true
        timeout: 5000
  - http:
      client:
        name: "yamlVertxHttpClient"
        requestUrl: "http://localhost:19302"
        timeout: 5000
actions:
  - http:
      client: "yamlVertxHttpClient"
      sendRequest:
        uri: "http://localhost:19302"
        fork: true
        GET:
          path: "/orders/42"
  - http:
      server: "yamlVertxHttpServer"
      receiveRequest:
        timeout: 5000
        GET:
          path: "/orders/42"
  - http:
      server: "yamlVertxHttpServer"
      sendResponse:
        response:
          status: "200"
          reasonPhrase: "OK"
          version: "HTTP/1.1"
          contentType: "text/plain"
          body:
            data: "Vert.x server response"
  - http:
      client: "yamlVertxHttpClient"
      receiveResponse:
        timeout: 5000
        response:
          status: "200"
