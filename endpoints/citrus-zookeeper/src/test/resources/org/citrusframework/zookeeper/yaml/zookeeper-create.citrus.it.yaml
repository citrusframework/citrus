name: ZookeeperCreateTest
author: Citrus
status: FINAL
actions:
  - zookeeper:
      client: myZookeeperClient
      description: "Create a node"
      result: '{"responseData":{"path":"/some-path"}}'
      validate:
        - path: $.responseData.path
          value: /some-path
      extract:
        - path: $.responseData.path
          variable: createdPath
      create:
        path: /some-path
        data: some-data
        mode: PERSISTENT
        acl: OPEN_ACL_UNSAFE
