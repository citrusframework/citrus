name: SftpYamlIT
author: Christoph
status: FINAL
description: "Sample test in YAML"
endpoints:
  - sftp:
      server:
        name: sftpYamlServer
        port: 22226
        host-key-path: classpath:org/citrusframework/ssh/citrus.pem
        user: admin
        password: admin
        user-home-path: target/sftp/user/admin
        auto-connect: true
        timeout: 1000
        auto-start: true
  - sftp:
      client:
        name: sftpYamlClient
        host: localhost
        port: 22226
        username: admin
        password: admin
        strict-host-checking: false
actions:
  - echo:
      message: "Test 1: Upload file to SFTP server"
  - send:
      endpoint: sftpYamlClient
      fork: true
      message:
        body:
          data: |
            <command xmlns="http://www.citrusframework.org/schema/ftp/message">
              <signal>STOR</signal>
              <arguments>classpath:org/citrusframework/ftp/integration/hello.txt</arguments>
            </command>
  - receive:
      endpoint: sftpYamlClient
      message:
        body:
          data: |
            <put-command-result xmlns="http://www.citrusframework.org/schema/ftp/message">
              <success>true</success>
              <reply-code>226</reply-code>
              <reply-string>Transfer complete</reply-string>
            </put-command-result>
