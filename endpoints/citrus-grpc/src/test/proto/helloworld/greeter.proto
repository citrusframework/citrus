syntax = "proto3";

package helloworld;

option java_package = "org.citrusframework.grpc.test.proto.helloworld";
option java_multiple_files = true;

service Greeter {
  rpc SayHello (HelloRequest) returns (HelloReply);
  rpc GetUser (GetUserRequest) returns (UserInfo);
}

message HelloRequest {
  string name = 1;
  int32 user_id = 2;
}

message HelloReply {
  string message = 1;
}

message GetUserRequest {
  string id = 1;
}

message UserInfo {
  string name = 1;
}
