syntax = "proto3";

package feat;

option java_package = "org.citrusframework.grpc.test.proto.feat";
option java_multiple_files = true;

import "google/protobuf/any.proto";

message Feature {
  string id = 1;
  string renamed = 2 [json_name = "otherName"];
  Kind kind = 3;
  map<string, string> labels = 4;
  Nested nested = 5;
  google.protobuf.Any details = 6;

  oneof choice {
    string text = 7;
    int64 number = 8;
  }

  message Nested {
    string value = 1;
    repeated string tags = 2;
  }

  enum Kind {
    KIND_UNSPECIFIED = 0;
    KIND_BASIC = 1;
    KIND_FANCY = 2;
  }
}

message Counter {
  int32 count = 1;
}
