syntax = "proto3";

package market;

option java_package = "org.citrusframework.grpc.test.proto.market";
option java_multiple_files = true;

import "common/money.proto";
import "google/protobuf/timestamp.proto";

service Prices {
  rpc Subscribe (PriceSubscription) returns (stream Price);
}

message PriceSubscription {
  string symbol = 1;
}

message Price {
  string symbol = 1;
  common.Money amount = 2;
  google.protobuf.Timestamp as_of = 3;
}
