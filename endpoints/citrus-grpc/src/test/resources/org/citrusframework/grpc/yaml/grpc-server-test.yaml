name: "GrpcServerTest"
author: "Citrus"
status: "FINAL"
actions:
  - grpc:
      server: "grpcServer"
      receive:
        call: "helloworld.Greeter/SayHello"
        metadata:
          - name: "authorization"
            value: "Bearer token"
        message:
          body:
            data: '{"name": "Ada"}'
  - grpc:
      server: "grpcServer"
      receive:
        streamMessage: true
        message:
          body:
            data: '{"id": 2}'
  - grpc:
      server: "grpcServer"
      receive:
        streamCompleted:
          status: "OK"
  - grpc:
      server: "grpcServer"
      actor: "grpcActor"
      send:
        response:
          status: "OK"
        metadata:
          - name: "x-request-id"
            value: "42"
        trailer:
          - name: "x-trailer"
            value: "42"
        message:
          body:
            data: '{"message": "Hello Ada"}'
  - grpc:
      server: "grpcServer"
      send:
        streamMessage: true
        message:
          body:
            data: '{"symbol": "ACME"}'
  - grpc:
      server: "grpcServer"
      send:
        streamCompleted:
          status: "OK"
