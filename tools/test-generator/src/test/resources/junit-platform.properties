# Test classes run sequentially; the methods of one class share a thread.
# Every generator test writes into the same output tree (the CitrusSettings
# default test source directory) and FileUtils.writeToFile creates parent
# folders with an exists()/mkdirs() check that races between concurrent
# writers. Keep classes sequential to avoid that flake.
# Run fully sequentially with -Djunit.jupiter.execution.parallel.enabled=false
junit.jupiter.execution.parallel.enabled = true
junit.jupiter.execution.parallel.mode.default = same_thread
junit.jupiter.execution.parallel.mode.classes.default = same_thread
