name: HamcrestYamlTest
author: Christoph
status: FINAL
description: "Hamcrest validation matchers in YAML tests"
endpoints:
  - direct:
      name: hamcrestYamlEndpoint
      queue-name: hamcrestYamlQueue
      auto-create-queue: true
actions:
  - echo:
      message: "Test hamcrest validation matchers in YAML"
  - send:
      endpoint: hamcrestYamlEndpoint
      message:
        headers:
          - name: Operation
            value: sayHello
        body:
          data: |
            Hello Citrus!
  - receive:
      endpoint: hamcrestYamlEndpoint
      message:
        type: "plaintext"
        headers:
          - name: Operation
            value: "@assertThat(endsWith(Hello))@"
        body:
          data: |
            Hello Citrus!
  - send:
      endpoint: hamcrestYamlEndpoint
      message:
        headers:
          - name: Operation
            value: sayHi
        body:
          data: |
            Hello Citrus!
  - receive:
      endpoint: hamcrestYamlEndpoint
      message:
        type: "plaintext"
        headers:
          - name: Operation
            value: "@assertThat(anyOf(is(sayHello), is(sayHi)))@"
        body:
          data: |
            Hello Citrus!
  - iterate:
      condition: "@assertThat('${i}', 'lessThanOrEqualTo(5)')@"
      index: "i"
      actions:
        - echo:
            message: "iteration ${i}"
