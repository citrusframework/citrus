name: JsonHamcrestYamlTest
author: Christoph
status: FINAL
description: "Hamcrest matchers with JsonPath validation in YAML tests"
endpoints:
  - direct:
      name: jsonHamcrestYamlEndpoint
      queue-name: jsonHamcrestYamlQueue
      auto-create-queue: true
actions:
  - echo:
      message: "Test hamcrest matchers with JsonPath in YAML"
  - send:
      endpoint: jsonHamcrestYamlEndpoint
      message:
        type: "json"
        body:
          data: |
            {
              "text": "Hello Citrus!",
              "greetings": ["Hello", "Hi", "Hey"],
              "index": 23,
              "lastModified": null
            }
  - receive:
      endpoint: jsonHamcrestYamlEndpoint
      message:
        type: "json"
      validate:
        - jsonPath:
            - expression: "$.text"
              value: "@assertThat(allOf(startsWith(Hello), endsWith(Citrus!)))@"
            - expression: "$.greetings"
              value: "@assertThat(hasItem(Hello))@"
            - expression: "$.greetings"
              value: "@assertThat(hasItems(Hello, Hi))@"
            - expression: "$.index"
              value: "@assertThat(not(is(42)))@"
            - expression: "$.lastModified"
              value: "@assertThat(anyOf(is(1970-01-01), nullValue()))@"
