name: Publish test report
description: Upload Maven Surefire/Failsafe reports and publish a JUnit test summary with failure annotations.

inputs:
  report-name:
    description: Name of the check run created by dorny/test-reporter.
    required: false
    default: Maven Tests
  artifact-name:
    description: Name of the uploaded test-reports artifact.
    required: false
    default: surefire-reports

runs:
  using: composite
  steps:
    - name: Upload test reports
      if: ${{ !cancelled() }}
      uses: actions/upload-artifact@v4
      with:
        name: ${{ inputs.artifact-name }}
        path: |
          **/target/surefire-reports/*.xml
          **/target/surefire-reports/*.txt
          **/target/failsafe-reports/*.xml
          **/target/failsafe-reports/*.txt
        retention-days: 7

    - name: Test Report
      if: ${{ !cancelled() }}
      uses: dorny/test-reporter@v2
      with:
        name: ${{ inputs.report-name }}
        # Only surefire's own TEST-*.xml schema (emitted for JUnit and
        # TestNG providers alike). TestNG-native testng-results.xml and
        # failsafe-summary.xml use different schemas and must stay out:
        # dorny requires every matched file to share one format.
        path: '**/target/surefire-reports/TEST-*.xml,**/target/failsafe-reports/TEST-*.xml'
        reporter: java-junit
        # Build status already comes from the Maven step, so the report
        # itself stays informational. This also keeps fork PRs (read-only
        # token, cannot create check runs) from failing here when tests pass.
        fail-on-error: 'false'
        # Incremental (gib) builds may produce no reports when only docs
        # or non-code files change.
        fail-on-empty: 'false'
        # Citrus has thousands of tests: only expand failures to stay
        # under the 64k summary limit. Counts still show totals.
        list-suites: 'failed'
        list-tests: 'failed'
        max-annotations: '10'
