name: nightly

on:
  workflow_dispatch:
  schedule:
    - cron: "30 1 * * *"

jobs:
  report-dependencies:
    runs-on: ubuntu-latest
    steps:
      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'
      - name: Checkout code
        uses: actions/checkout@v6
      - name: Cache Maven cache
        uses: actions/cache@v5
        with:
          path: ~/.m2
          key: ${{ runner.os }}-m2-${{ hashFiles('**/pom.xml') }}
          restore-keys: ${{ runner.os }}-m2
      - name: Info
        run: |
          java -version
          ./mvnw -version
      - name: Citrus Dependency Report
        run: |
          ./mvnw --no-transfer-progress versions:display-dependency-updates

  generate-metadata:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'
      - name: Cache Maven cache
        uses: actions/cache@v5
        with:
          path: ~/.m2
          key: ${{ runner.os }}-m2-${{ hashFiles('**/pom.xml') }}
          restore-keys: ${{ runner.os }}-m2
      - name: Build project
        run: ./mvnw --no-transfer-progress install -DskipTests
      - name: Generate metadata
        run: ./mvnw --no-transfer-progress compile -Pgenerate-metadata
      - name: Create PR if metadata changed
        uses: peter-evans/create-pull-request@v7
        with:
          commit-message: "chore: Update Citrus config metadata"
          title: "chore: Update Citrus config metadata"
          body: |
            Automated update of `spring-configuration-metadata.json` files
            generated by `./mvnw compile -Pgenerate-metadata`.
          branch: chore/update-config-metadata
          delete-branch: true
