name: main

on:
  pull_request:
    paths-ignore:
      - '**.adoc'
      - '**.md'
      - 'KEYS'
      - 'LICENSE'
      - 'NOTICE'
  push:
    branches:
      - main
    paths-ignore:
      - '**.adoc'
      - '**.md'
      - 'KEYS'
      - 'LICENSE'
      - 'NOTICE'

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # Browsers come from the playwright-runtimes profile only, so a missing
      # runtime surfaces as skipped tests instead of an implicit full download.
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
    steps:
      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          # gitflow-incremental-builder diffs this branch against origin/main,
          # so it needs real history rather than the default shallow clone.
          fetch-depth: 0
      - name: Fetch main for incremental build
        if: github.event_name == 'pull_request'
        run: git fetch --no-tags origin main:refs/remotes/origin/main
      - name: Cache Maven cache
        uses: actions/cache@v5
        with:
          path: ~/.m2
          key: ${{ runner.os }}-m2-${{ hashFiles('**/pom.xml') }}
          restore-keys: ${{ runner.os }}-m2
      - name: Cache Playwright browsers
        uses: actions/cache@v5
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('pom.xml') }}
          restore-keys: ${{ runner.os }}-playwright
      - name: Info
        run: |
          java -version
          ./mvnw -version
      - name: Build Citrus
        run: |
          echo "Install JBang via SDKMAN"

          curl -s "https://get.sdkman.io" | bash 
          source "/home/runner/.sdkman/bin/sdkman-init.sh"
          sdk install jbang
          
          jbang --version
          
          # On a pull request, build only the modules this branch touched plus
          # everything downstream of them. Pushes to main always build in full.
          ./mvnw --no-transfer-progress install -P${MAVEN_PROFILES}
        env:
          MAVEN_PROFILES: ${{ github.event_name == 'pull_request' && 'playwright-runtimes,gib' || 'playwright-runtimes' }}

      - name: Show modules selected by the incremental build
        if: always() && github.event_name == 'pull_request'
        run: cat target/gib-impacted-modules.log || echo "no impacted-modules log (full build or nothing selected)"
