name: orders
description: Order service tests
beforeAll:
  - createVariables:
      variables:
        - name: orderId
          value: "1001"
  - createEndpoint:
      name: orderEndpoint
      type: direct:multiOrders
  - echo:
      message: "Start order service"
beforeEach:
  - echo:
      message: "Reset orders for ${citrus.test.name}"
afterEach:
  - echo:
      message: "Clean up after ${citrus.test.name}"
afterAll:
  - echo:
      message: "Stop order service"
tests:
  - name: createOrder_ok
    description: Order is created
    actions:
      - send:
          endpoint: orderEndpoint
          message:
            body:
              data: "<order id=\"${orderId}\"/>"
      - receive:
          endpoint: orderEndpoint
          message:
            body:
              data: "<order id=\"${orderId}\"/>"
  - name: createOrder_otherId
    variables:
      - name: orderId
        value: "1002"
    actions:
      - send:
          endpoint: orderEndpoint
          message:
            body:
              data: "<order id=\"${orderId}\"/>"
      - receive:
          endpoint: orderEndpoint
          message:
            body:
              data: "<order id=\"1002\"/>"
