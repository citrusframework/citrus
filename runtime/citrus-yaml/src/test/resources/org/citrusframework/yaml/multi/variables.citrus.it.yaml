name: variables
beforeAll:
  - createVariables:
      variables:
        - name: user
          value: alice
        - name: brokerUrl
          value: "tcp://localhost:61616"
afterAll:
  - action:
      ref: recordUser
  - action:
      ref: recordOrderIdKnown
tests:
  - name: a
    actions:
      - action:
          ref: recordUser
      - action:
          ref: recordBrokerUrl
      - createVariables:
          variables:
            - name: user
              value: changed
            - name: orderId
              value: "1"
  - name: b
    variables:
      - name: user
        value: bob
    actions:
      - action:
          ref: recordUser
      - action:
          ref: recordOrderIdKnown
  - name: c
    actions:
      - action:
          ref: recordUser
