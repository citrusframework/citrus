name: beforeEachFails
beforeEach:
  - action:
      ref: failWhenBroken
afterEach:
  - action:
      ref: afterEach
tests:
  - name: a
    variables:
      - name: mode
        value: ok
    actions:
      - action:
          ref: a
  - name: b
    variables:
      - name: mode
        value: broken
    actions:
      - action:
          ref: b
  - name: c
    variables:
      - name: mode
        value: ok
    actions:
      - action:
          ref: c
